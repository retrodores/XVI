name: Build

on:
  push:
    branches: [master]
    tags: ['draft-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [cx16, c64]
    runs-on: ubuntu-24.04
    env:
      PROG8_VERSION: 14.0-BETA3
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install assembler
        run: |
          sudo apt-get update
          sudo apt-get install -y 64tass
      - name: Download and verify Prog8
        run: |
          mkdir -p build/tools
          curl -fL --retry 3 "https://github.com/irmen/prog8/releases/download/v${PROG8_VERSION}/prog8c-${PROG8_VERSION}-all.jar" -o "build/tools/prog8c-${PROG8_VERSION}-all.jar"
          echo "7117cabdb1d3ecf11d4f38aa7e2cea570056a3eb2c3b3f4e8593838b1b4115c0  build/tools/prog8c-${PROG8_VERSION}-all.jar" | sha256sum -c -
      - name: Build program
        run: make build TARGET="$TARGET" OPT=-noopt JAR="$PWD/build/tools/prog8c-${PROG8_VERSION}-all.jar"
      - name: Package PRG
        run: |
          test -s xvi2.prg
          mkdir -p build/${{ matrix.target }}
          cp xvi2.prg build/${{ matrix.target }}/XVI2.PRG
      - uses: actions/upload-artifact@v4
        with:
          name: xvi2-${{ matrix.target }}-prog8-14.0-BETA3
          path: build/${{ matrix.target }}/XVI2.PRG
          if-no-files-found: error

  draft-release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/draft-')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xvi2-*-prog8-14.0-BETA3
          path: artifacts
      - name: Prepare release files
        run: |
          mkdir release
          cp artifacts/xvi2-cx16-prog8-14.0-BETA3/XVI2.PRG release/XVI2-X16.PRG
          cp artifacts/xvi2-c64-prog8-14.0-BETA3/XVI2.PRG release/XVI2-C64.PRG
          cd release
          sha256sum *.PRG > SHA256SUMS.txt
      - name: Create draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          XVI2 development build for Commander X16 and Commodore 64.

          Assets: XVI2-X16.PRG and XVI2-C64.PRG, plus SHA-256 checksums.
          Built on Linux with Prog8 14.0-BETA3 and 64tass, using -noopt.
          Both targets compile and assemble; emulator/runtime testing is pending.
          NOTES
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --prerelease --title "XVI2 development build ($RELEASE_TAG)" --notes-file notes.md
