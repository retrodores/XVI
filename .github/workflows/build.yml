name: Build

on:
  push:
    branches: [master]
    tags: ['draft-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [cx16, c64]
    runs-on: ubuntu-24.04
    env:
      PROG8_VERSION: 14.0-BETA3
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install assembler
        run: |
          sudo apt-get update
          sudo apt-get install -y 64tass
      - name: Download and verify Prog8
        run: |
          mkdir -p build/tools
          curl -fL --retry 3 "https://github.com/irmen/prog8/releases/download/v${PROG8_VERSION}/prog8c-${PROG8_VERSION}-all.jar" -o "build/tools/prog8c-${PROG8_VERSION}-all.jar"
          echo "7117cabdb1d3ecf11d4f38aa7e2cea570056a3eb2c3b3f4e8593838b1b4115c0  build/tools/prog8c-${PROG8_VERSION}-all.jar" | sha256sum -c -
      - name: Build program
        run: make build TARGET="$TARGET" OPT=-noopt JAR="$PWD/build/tools/prog8c-${PROG8_VERSION}-all.jar"
      - name: Package PRG
        run: |
          test -s xvi2.prg
          mkdir -p build/${{ matrix.target }}
          cp xvi2.prg build/${{ matrix.target }}/XVI2.PRG
      - uses: actions/upload-artifact@v4
        with:
          name: xvi2-${{ matrix.target }}-prog8-14.0-BETA3
          path: build/${{ matrix.target }}/XVI2.PRG
          if-no-files-found: error

  draft-release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/draft-')
    needs: [build, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xvi2-*-prog8-14.0-BETA3
          path: artifacts
      - name: Prepare release files
        run: |
          mkdir release
          cp artifacts/xvi2-cx16-prog8-14.0-BETA3/XVI2.PRG release/XVI2-X16.PRG
          cp artifacts/xvi2-c64-prog8-14.0-BETA3/XVI2.PRG release/XVI2-C64.PRG
          cd release
          sha256sum *.PRG > SHA256SUMS.txt
      - name: Create draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          XVI2 development build for Commander X16 and Commodore 64.

          Assets: XVI2-X16.PRG and XVI2-C64.PRG, plus SHA-256 checksums.
          Built on Linux with Prog8 14.0-BETA3 and 64tass, using -noopt.
          Both targets compile and assemble. Buffer and document suites pass in Prog8 VM, headless x16emu, and headless VICE. Interactive editor testing remains manual.
          NOTES
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --prerelease --title "XVI2 development build ($RELEASE_TAG)" --notes-file notes.md

  test:
    name: TAP tests (${{ matrix.backend }})
    strategy:
      fail-fast: false
      matrix:
        backend: [virtual, cx16, c64]
    runs-on: ubuntu-24.04
    env:
      PROG8_VERSION: 14.0-BETA3
      BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y perl python3 64tass unzip libsdl2-2.0-0
      - name: Download and verify Prog8
        run: |
          mkdir -p build/tools
          curl -fL --retry 3 "https://github.com/irmen/prog8/releases/download/v${PROG8_VERSION}/prog8c-${PROG8_VERSION}-all.jar" -o "build/tools/prog8c-${PROG8_VERSION}-all.jar"
          echo "7117cabdb1d3ecf11d4f38aa7e2cea570056a3eb2c3b3f4e8593838b1b4115c0  build/tools/prog8c-${PROG8_VERSION}-all.jar" | sha256sum -c -
      - name: Download and verify headless X16 emulator
        if: matrix.backend == 'cx16'
        run: |
          curl -fL --retry 3 https://github.com/X16Community/x16-emulator/releases/download/r49/x16emu_linux-x86_64-r49.zip -o build/tools/x16emu-r49.zip
          echo 'efb2d4ad36ae4244370004891aa67bdf85d2ec01b42b7f12f97b48b62aff009d  build/tools/x16emu-r49.zip' | sha256sum -c -
          unzip -q build/tools/x16emu-r49.zip -d build/tools/x16emu
          chmod +x build/tools/x16emu/x16emu
      - name: Install VICE and verified C64 ROMs
        if: matrix.backend == 'c64'
        run: |
          sudo apt-get install -y vice
          python3 t/fetch_vice_roms.py build/tools/vice-roms
      - name: Execute P8 TAP tests with prove
        run: |
          export JAR="$PWD/build/tools/prog8c-${PROG8_VERSION}-all.jar"
          if [ "$BACKEND" = cx16 ]; then
            export X16EMU="$PWD/build/tools/x16emu/x16emu"
            export X16ROM="$PWD/build/tools/x16emu/rom.bin"
            test -x "$X16EMU" && test -s "$X16ROM"
            prove -v t/03-*.t t/04-*.t
          elif [ "$BACKEND" = c64 ]; then
            export VICE="$(command -v x64sc)"
            export VICE_ROMS="$PWD/build/tools/vice-roms"
            test -x "$VICE" && test -s "$VICE_ROMS/kernal-901227-03.bin"
            prove -v t/05-*.t t/06-*.t
          else
            prove -v t/01-*.t t/02-*.t
          fi
