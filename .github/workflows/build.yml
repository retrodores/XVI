name: Restored editors
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    name: Verify restored source and binary identities
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: prove -v t/*.t
  package:
    name: Package ${{ matrix.editor }} restored baseline
    needs: identity
    strategy:
      matrix:
        editor: [xvi2, xvi]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.editor == 'xvi2'
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare historical XVI2 compiler
        if: matrix.editor == 'xvi2'
        run: |
          sudo apt-get update
          sudo apt-get install -y 64tass
          curl -fL --retry 3 https://github.com/irmen/prog8/releases/download/v12.0.1/prog8c-12.0.1-all.jar -o prog8c-12.0.1-all.jar
          echo '83bfbade1ee8cdc0cf846740339a6e3c4656aa1f5b63f55b054e5c0f18c810a0  prog8c-12.0.1-all.jar' | sha256sum -c -
      - name: Build XVI2 or recover archived VTUI executable
        run: make build XVI_EDITOR="${{ matrix.editor }}"
      - name: Package PRG
        env:
          TASK_EDITOR: ${{ matrix.editor }}
        run: |
          mkdir -p build/recovered
          if [ "$TASK_EDITOR" = xvi2 ]; then
            cp xvi2.prg build/recovered/XVI2-X16.PRG
          else
            cp xvi.prg build/recovered/XVI-VTUI-ORIGINAL.PRG
            cmp xvi.prg recovery/XVI-VTUI-ORIGINAL.PRG
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: restored-${{ matrix.editor }}
          path: build/recovered/*.PRG
          if-no-files-found: error
